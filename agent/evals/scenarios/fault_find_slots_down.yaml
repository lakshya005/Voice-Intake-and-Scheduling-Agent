# Failure drill: the slot search is down. The caller must be handed to staff, never told a time.
name: fault_find_slots_down
judge: !include ../judge.yaml
scenarios:
  - name: slot_search_down
    turns:
      - expect:  # wait for the greeting, or the first caller line races the flow's start
          - event: llm_response
            text_contains: scheduling line
      - user: "Hi, my name is Danielle Johnson and my date of birth is October 20, 1955."
        expect:
          - event: function_call
            calls: [{name: verify_patient}]
          - event: llm_response
      - user: "I'd like to book an appointment."
        expect:
          - event: function_call
            calls: [{name: start_booking}]
          - event: llm_response
      - user: "I need a routine checkup."
        expect:
          - event: function_call
            calls: [{name: record_reason}]
          - event: llm_response
      - user: "Any weekday morning works for me."
        expect:
          - event: function_call
            calls: [{name: find_slots}]
          - event: function_call
            absent: true
            within_ms: 5000
