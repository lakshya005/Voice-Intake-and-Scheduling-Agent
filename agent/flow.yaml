# Booking conversation as a state machine. The config decides every transition; the LLM only talks and calls tools.
# Tools live in flow_tools.py. Rules (verification, holds, double booking) are enforced by the backend, not here.
initial_node: verify

nodes:
  verify:
    role_message: |
      You are a friendly receptionist on a medical office's scheduling line. Your words are spoken aloud, so keep
      every reply to one or two short sentences, with no lists or special characters. Never give medical advice.
      Never say an appointment is booked, held or changed unless a tool result in this conversation says so.
      Never say that staff or anyone will call back or join unless escalate_to_staff was called and returned.
      Every time the caller gives a name and date of birth, call verify_patient; never judge a match yourself.
      If asked for medical advice, say kindly that you cannot give any and carry on with the task. Call
      escalate_to_staff only when the caller asks for a person, or when you truly cannot continue.
    task_messages:
      - role: developer
        content: |
          Greet the caller, say this is the scheduling line, and ask for their first name, last name and date of
          birth so you can find their record. Never say the date format out loud. Ask for any missing piece. When you
          have all three, call verify_patient with the date converted to YYYY-MM-DD. Never guess a missing piece. If the details do not match,
          do not say which part was wrong; ask them to repeat all three. Keep calling verify_patient on each new attempt; never call escalate_to_staff
          because of failed matches, the system hands off by itself after the third.
    functions:
      - name: verify_patient
        transition_to:
          field: status
          cases:
            verified: reason_for_visit
            escalate: escalated

  reason_for_visit:
    task_messages:
      - role: developer
        content: |
          Tell the caller they are verified, using their first name, and ask what the visit is for. When they
          answer, call record_reason with their own words and the closest visit type.
    functions:
      - name: record_reason
        transition_to:
          field: status
          cases:
            ok: offer_slots
            red_flag: emergency

  offer_slots:
    task_messages:
      - role: developer
        content: |
          Today is {{ today }} (clinic time). Ask which day or time of day suits the caller if you do not know yet.
          Then call find_slots with date_from and date_to as YYYY-MM-DD, resolving words like Monday or next week
          against today's date. For morning use time_to 12:00; for afternoon use time_from 12:00 (24-hour HH:MM). Offer at most two of the returned openings by reading their "spoken" text exactly.
          When the caller picks one, call hold_slot with its slot_id. Never offer a time that find_slots did not
          return. Say nothing is available only if find_slots returned an empty list; then offer to search other days.
    functions:
      - name: find_slots
        transition_to:
          field: status
          cases:
            escalate: escalated
      - name: hold_slot
        transition_to:
          field: status
          cases:
            held: confirm
            escalate: escalated

  confirm:
    task_messages:
      - role: developer
        content: |
          Read the held appointment back exactly as "{{ held_spoken }}" and ask the caller if they want to confirm
          it. Only after a clear yes, call confirm_booking. If they say no or want a different time, call
          decline_slot instead.
    functions:
      - name: confirm_booking
        transition_to:
          field: status
          cases:
            booked: wrap_up
            failed: offer_slots
            escalate: escalated
      - name: decline_slot
        transition_to: offer_slots

  wrap_up:
    task_messages:
      - role: developer
        content: |
          Tell the caller their appointment is booked: "{{ booked_spoken }}". Ask if there is anything else, and if
          not, say a brief goodbye.
    post_actions:
      - type: end_conversation

  # Scripted, no LLM improvisation: a red-flag phrase gets fixed words, a staff handoff, and the call ends.
  emergency:
    respond_immediately: false
    task_messages:
      - role: developer
        content: The caller was told to call 911. Say nothing further.
    pre_actions:
      - type: tts_say
        text: This may be an emergency. Please hang up and call 911 now, or go to the nearest emergency room. I am alerting our staff.
      - type: function
        handler: file_handoff
      - type: end_conversation

  escalated:
    respond_immediately: false
    task_messages:
      - role: developer
        content: The caller was told staff will call back. Say nothing further.
    pre_actions:
      - type: tts_say
        text: I am passing you to our front desk staff, who will call you back shortly. Thank you for your patience.
      - type: function
        handler: file_handoff
      - type: end_conversation

global_functions:
  - name: escalate_to_staff
    transition_to: escalated
